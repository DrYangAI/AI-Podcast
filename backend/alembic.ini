# Alembic configuration.
#
# The database URL is NOT set here on purpose — alembic/env.py derives it from
# the application settings (config.yaml / env vars) so there is a single source
# of truth. You can still override it for one-off commands with:
#   ALEMBIC_DB_URL="sqlite:///./data/db/scratch.db" alembic revision --autogenerate -m "..."

[alembic]
script_location = alembic
prepend_sys_path = .
# Placeholder; overridden in env.py.
sqlalchemy.url = sqlite:///./data/db/ai_podcast.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
